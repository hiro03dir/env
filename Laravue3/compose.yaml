version: "3"
services:
  une-app:
    build:
      context: .
      dockerfile: ./docker/php/dockerfile
    container_name: une-app
    volumes:
      - ./une-app/:/var/www/une-app
      - ./common-frontend/:/var/www/common-frontend
      - ./common-backend/:/var/www/common-backend
    ports:
      - "8000:8000"
      - "9000:9000"
      - "5173:5173"
    working_dir: /var/www/une-app
    environment:
      - "DB_HOST=mysql"
      - "DB_PORT=3306"
      - "DB_DATABASE=laravel"
      - "DB_USERNAME=user"
      - "DB_PASSWORD=secret"

