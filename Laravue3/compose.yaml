  mysql:
    image: mysql:8.0.23
    platform: linux/amd64
    container_name: mysql_db
    environment:
      - "MYSQL_DATABASE=laravel"
      - "MYSQL_USER=user"
      - "MYSQL_PASSWORD=secret"
      - "MYSQL_ROOT_PASSWORD=secret"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  mysql_data:
